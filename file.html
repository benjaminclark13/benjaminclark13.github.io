<style>
:root{
  --void:#0a0a0b; --ash:#141416; --smoke:#8d8d92; --dim:#5c5c61;
  --bone:#e8e6e3; --blood:#8b0000; --ember:#c1121f; --rule:rgba(232,230,227,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--void);color:var(--bone);font-family:'Cormorant Garamond',serif;
  font-size:19px;line-height:1.75;-webkit-font-smoothing:antialiased}

nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,11,.9);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
nav .inner{max-width:1100px;margin:0 auto;padding:1.1rem 1.5rem;display:flex;
  justify-content:space-between;align-items:center;gap:1.5rem}
nav .mark{font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;font-size:.78rem;color:var(--bone);text-decoration:none}
nav ul{display:flex;gap:1.75rem;list-style:none;flex-wrap:wrap}
nav a.link{font-family:'Rajdhani',sans-serif;letter-spacing:.16em;text-transform:uppercase;
  font-size:.72rem;color:var(--smoke);text-decoration:none;transition:color .3s ease}
nav a.link:hover,nav a.link[aria-current="page"]{color:var(--ember)}

.wrap{max-width:1100px;margin:0 auto;padding:0 1.5rem}

header.filehead{padding:10rem 1.5rem 0;max-width:1100px;margin:0 auto}
.back{display:inline-block;font-family:'Rajdhani',sans-serif;font-size:.7rem;font-weight:600;
  letter-spacing:.24em;text-transform:uppercase;color:var(--smoke);text-decoration:none;
  margin-bottom:2rem;transition:color .3s ease}
.back:hover{color:var(--ember)}
.eyebrow{font-family:'Rajdhani',sans-serif;font-size:.7rem;font-weight:600;
  letter-spacing:.34em;text-transform:uppercase;color:var(--ember);margin-bottom:1.4rem}
header.filehead h1{font-weight:300;font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.05;letter-spacing:-.01em}
.meta{margin-top:1.6rem;display:flex;flex-wrap:wrap;gap:2.5rem;align-items:baseline;
  border-top:1px solid var(--blood);border-bottom:1px solid var(--rule);padding:1rem 0;
  font-family:'Rajdhani',sans-serif;font-size:.7rem;font-weight:500;letter-spacing:.24em;
  text-transform:uppercase;color:var(--dim)}
.meta b{color:var(--bone);font-weight:600}
.meta .tags{color:var(--blood)}

main{max-width:1100px;margin:0 auto;padding:0 1.5rem 6rem}
.body{margin-top:2.75rem;max-width:62ch;border-left:1px solid var(--rule);padding-left:1.75rem}
.body p{margin-bottom:1.3rem}
.body h2,.body h3,.body h4{font-weight:400;margin:2.2rem 0 .9rem;line-height:1.25}
.body a{color:var(--ember);text-decoration:none;border-bottom:1px solid rgba(193,18,31,.35)}
.body img{max-width:100%;height:auto;display:block;margin:2rem 0;filter:saturate(.8)}
.body blockquote{border-left:2px solid var(--blood);padding-left:1.4rem;font-style:italic;
  color:var(--smoke);margin:1.8rem 0}
.body ul,.body ol{margin:0 0 1.3rem 1.3rem}
.body li{margin-bottom:.5rem}

.source{display:inline-block;margin-top:2rem;font-family:'Rajdhani',sans-serif;font-size:.68rem;
  font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  text-decoration:none;border-bottom:1px solid var(--rule)}
.source:hover{color:var(--bone)}

.related{margin-top:3.5rem;border-top:1px solid var(--rule);padding-top:1.6rem;max-width:62ch}
.related .rlabel{font-family:'Rajdhani',sans-serif;font-size:.66rem;font-weight:700;
  letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-bottom:1rem}
.rfile{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  padding:.6rem 0;border-bottom:1px solid rgba(232,230,227,.05);
  font-family:'Rajdhani',sans-serif;font-size:.82rem;letter-spacing:.05em;text-decoration:none}
.rfile:last-child{border-bottom:none}
.rfile .name{color:var(--bone);transition:color .25s ease}
.rfile .arrow{color:var(--ember);margin-right:.6rem}
a.rfile:hover .name{color:var(--ember)}
.rfile .rstatus{font-size:.6rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
.rfile .rstatus.available{color:var(--smoke)}
.rfile .rstatus.classified{color:var(--ember)}
.rfile.locked{cursor:default}
.rfile.locked .arrow{color:var(--blood)}
.rfile.locked .name{color:var(--dim)}

.state{padding:8rem 0;color:var(--smoke);font-style:italic;text-align:center}
.state.error{font-style:normal;font-family:'Rajdhani',sans-serif;letter-spacing:.06em}
.state .diamond{color:var(--blood);display:block;margin-bottom:1rem;font-style:normal}
.state a{color:var(--ember);text-decoration:none;border-bottom:1px solid rgba(193,18,31,.35)}

footer{border-top:1px solid var(--rule);padding:3rem 1.5rem;text-align:center;
  font-family:'Rajdhani',sans-serif;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

@media (max-width:720px){
  body{font-size:18px}
  header.filehead{padding-top:8.5rem}
  .meta{gap:1.2rem;font-size:.65rem}
  .body{padding-left:1.1rem}
  nav .inner{flex-direction:column;align-items:flex-start;gap:.7rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<nav>

    <ul>

<header class="filehead">
  <a class="back" href="journal.html">&#9664; The Archive</a>
  <div id="head" hidden>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="meta">
      <span>Recovered <b id="date"></b></span>
      <span>Status <b>Recovered</b></span>
      <span class="tags" id="tags"></span>
    </div>
  </div>
</header>

<main>
  <div id="state" class="state"><span class="diamond">&#9670;</span>Opening the file…</div>
  <div class="body" id="body" hidden></div>
  <a class="source" id="source" href="#" target="_blank" rel="noopener" hidden>View original &#8599;</a>
  <div class="related" id="related" hidden></div>
</main>

<footer>&copy; 2026 Benjamin Clark</footer>

<script>
const BLOG_HOST = 'recoveredeveryfriday.blogspot.com';

const pad = n => String(n).padStart(3,'0');
const fmtDate = iso => new Date(iso).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});

function param(name){
  const m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1]) : null;
}

function fail(msg){
  document.getElementById('state').className = 'state error';
  document.getElementById('state').innerHTML =
    '<span class="diamond">&#9670;</span>' + msg +
    ' <a href="journal.html">Return to the archive.</a>';
}

function fetchAll(){
  return new Promise((resolve, reject) => {
    const cb = 'fileCb' + Date.now();
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 12000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error('network')); };
    s.src = 'https://' + BLOG_HOST + '/feeds/posts/default?alt=json-in-script'
          + '&callback=' + cb + '&start-index=1&max-results=500';
    document.body.appendChild(s);
  });
}

function relatedRow(num, total, titles, isNext){
  const available = num >= 1 && num <= total;
  const label = (isNext ? 'Continue to File No. ' : 'File No. ') + pad(num);
  if (available){
    return '<a class="rfile" href="file.html?no=' + pad(num) + '">'
      + '<span class="name"><span class="arrow">&#9658;</span>' + label + '</span>'
      + '<span class="rstatus available">Available</span></a>';
  }
  return '<div class="rfile locked">'
    + '<span class="name"><span class="arrow">&#9658;</span>' + label + '</span>'
    + '<span class="rstatus classified">Classified</span></div>';
}

(async function(){
  let data;
  try { data = await fetchAll(); }
  catch (e){ return fail('The archive didn\'t open.'); }

  const feed = data.feed || {};
  const entries = feed.entry || [];
  if (!entries.length) return fail('The archive is sealed.');

  // Same numbering rule as journal.html: newest entry is the highest number.
  const total = feed.openSearch$totalResults
    ? parseInt(feed.openSearch$totalResults.$t, 10)
    : entries.length;

  const files = entries.map((e, i) => ({
    no: total - i,
    title: (e.title && e.title.$t) || 'Untitled',
    html: (e.content && e.content.$t) || (e.summary && e.summary.$t) || '',
    published: (e.published && e.published.$t) || '',
    labels: (e.category || []).map(c => c.term),
    link: ((e.link || []).find(l => l.rel === 'alternate') || {}).href || '#'
  }));

  let want = parseInt(param('no'), 10);
  if (isNaN(want)) want = total;               // no parameter: newest file

  const f = files.find(x => x.no === want);
  if (!f) return fail('File No. ' + pad(want) + ' has not been recovered.');

  document.getElementById('eyebrow').textContent = 'File No. ' + pad(f.no);
  document.getElementById('title').textContent = f.title;
  document.getElementById('date').textContent = f.published ? fmtDate(f.published) : '—';
  document.getElementById('tags').innerHTML = f.labels.map(l => '&#9670; ' + l).join(' &nbsp; ');
  document.getElementById('body').innerHTML = f.html;

  const src = document.getElementById('source');
  src.href = f.link;

  document.getElementById('related').innerHTML =
    '<div class="rlabel">Related files</div>'
    + [f.no - 2, f.no - 1].filter(n => n >= 1).map(n => relatedRow(n, total, files, false)).join('')
    + relatedRow(f.no + 1, total, files, true);

  document.getElementById('state').hidden = true;
  document.getElementById('head').hidden = false;
  document.getElementById('body').hidden = false;
  src.hidden = false;
  document.getElementById('related').hidden = false;

  document.title = 'File No. ' + pad(f.no) + ': ' + f.title + ' — Benjamin Clark';
  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute('content', f.title + ' — a recovered document from The Ascension archive.');

  // one page_view, with this file's own path
  gtag('event', 'page_view', {
    page_title: 'File No. ' + pad(f.no) + ' — ' + f.title,
    page_location: location.href,
    page_path: '/file.html?no=' + pad(f.no)
  });
})();
</script>
